name: collect
on:
  workflow_dispatch:
    inputs:
      anime_url:
        description: "Anime page link"
        default: "https://animeclips.online/horimiya/"
      seasons:
        description: "Folders, comma separated"
        default: "Season 1,Season 2,Season 3,Season 4"
      max_clips:
        description: "Clips per run"
        default: "12"
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release limit
        id: limit
        run: |
          COUNT=$(gh release view clips --json assets -q '.assets | length' 2>/dev/null || echo 0)
          echo "files in release: $COUNT"
          if [ "$COUNT" -ge 985 ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            gh workflow disable collect.yml
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.limit.outputs.full == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.limit.outputs.full == 'false'
        run: pip install playwright && playwright install --with-deps chromium
      - if: steps.limit.outputs.full == 'false'
        run: |
          gh release view clips --json assets -q '.assets[].name' > have.txt 2>/dev/null || touch have.txt
          gh release download clips --pattern done.txt --clobber 2>/dev/null || true
      - if: steps.limit.outputs.full == 'false'
        run: python collect.py
        env:
          ANIME_URL: ${{ inputs.anime_url }}
          SEASONS: ${{ inputs.seasons }}
          MAX_CLIPS: ${{ inputs.max_clips }}
      - if: steps.limit.outputs.full == 'false'
        run: |
          gh release view clips || gh release create clips --title clips --notes "clip library"
          if ls out/*.mp4 >/dev/null 2>&1; then gh release upload clips out/*.mp4 --clobber; fi
          if [ -f done.txt ]; then gh release upload clips done.txt --clobber; fi
