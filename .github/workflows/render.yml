name: render
on:
  workflow_dispatch:
    inputs:
      anime:
        description: "Clip name filter"
        default: "Attack_on_Titan"
      title:
        description: "End title (blank = from clip filter)"
        default: ""
      dialogues:
        description: "Dialogue scenes (1-3)"
        default: "2"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install numpy
      - run: |
          mkdir -p clips
          gh release view clips --json assets -q '.assets[].name' | grep -i -- "${ANIME:-Attack_on_Titan}" | shuf -n 40 > pick.txt
          while read n; do gh release download clips --pattern "$n" --dir clips; done < pick.txt
        env:
          ANIME: ${{ inputs.anime }}
      - run: python render.py
        env:
          ANIME: ${{ inputs.anime }}
          TITLE: ${{ inputs.title }}
          DIALOGUES: ${{ inputs.dialogues }}
      - run: |
          mv out/edit.mp4 out/trailer-${{ github.run_number }}.mp4
          mv credit.txt out/trailer-${{ github.run_number }}-clips.txt
          gh release view edits >/dev/null 2>&1 || gh release create edits --title edits --notes "finished videos"
          gh release upload edits out/trailer-${{ github.run_number }}.mp4 out/trailer-${{ github.run_number }}-clips.txt --clobber
