name: render
on:
  workflow_dispatch:
    inputs:
      anime:
        description: "Clip name filter"
        default: "Attack_on_Titan"
      mood:
        description: "hype or emotional"
        default: "hype"
      caption:
        description: "Hook line (optional, use / for a line break)"
        default: ""
      length:
        description: "Total seconds"
        default: "30"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install librosa
      - run: |
          mkdir -p clips
          gh release view clips --json assets -q '.assets[].name' | grep -i -- "${ANIME:-Attack_on_Titan}" | shuf -n 40 > pick.txt
          while read n; do gh release download clips --pattern "$n" --dir clips; done < pick.txt
        env:
          ANIME: ${{ inputs.anime }}
      - run: |
          mkdir -p songs
          gh release view songs --json assets -q '.assets[].name' | grep '\.mp3$' | shuf -n 6 > song_pick.txt
          while read n; do gh release download songs --pattern "$n" --dir songs; done < song_pick.txt
          gh release download songs --pattern credits.csv --clobber || true
      - run: python render.py
        env:
          DURATION: ${{ inputs.length }}
          MOOD: ${{ inputs.mood }}
          CAPTION: ${{ inputs.caption }}
      - run: |
          mv out/edit.mp4 out/edit-${{ github.run_number }}.mp4
          mv credit.txt out/edit-${{ github.run_number }}-credit.txt
          gh release view edits >/dev/null 2>&1 || gh release create edits --title edits --notes "finished videos"
          gh release upload edits out/edit-${{ github.run_number }}.mp4 out/edit-${{ github.run_number }}-credit.txt --clobber
